name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: [README.md, 'media/**']
  push:
    branches: [main]
    paths-ignore: [README.md, 'media/**']
  workflow_dispatch:
    inputs:
      full_audit:
        description: Audit every factory amp and pedal
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full_audit && 120 || 60 }}
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache xvfb qemu-user libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev

      # ccache checks every hit against the compiler and preprocessed source, so an old cache only costs misses.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        id: build
        run: cmake --build build --parallel "$(nproc)"

      - uses: actions/cache/save@v6
        if: always() && steps.build.outcome != 'skipped'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Test CPU dispatch under QEMU
        run: |
          LIVEWDF_TEST_EXPECT_AVX2=0 qemu-x86_64 -cpu SandyBridge build/tests/livewdf_tests '[cpu-kernels]'
          LIVEWDF_TEST_EXPECT_AVX2=1 qemu-x86_64 -cpu Haswell build/tests/livewdf_tests '[cpu-kernels]'
          LIVEWDF_TEST_EXPECT_AVX2=0 qemu-x86_64 -cpu Haswell,-fma build/tests/livewdf_tests '[cpu-kernels]'
          LIVEWDF_TEST_EXPECT_AVX2=0 qemu-x86_64 -cpu Haswell,-xsave build/tests/livewdf_tests '[cpu-kernels]'

      - name: End-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FULL_AUDIT: ${{ inputs.full_audit }}
        run: |
          xvfb-run -a "build/editor/LiveWDF_Editor_artefacts/Release/LiveWDF Editor" --selftest
          if [[ "$FULL_AUDIT" == true ]]; then
            circuits=(schematics/*/*.livewdf)
          else
            # CTest already renders the full factory catalog.
            circuits=(
              "schematics/amps/Fender Tweed Champ 5F1 - Input 1.livewdf"
              "schematics/amps/Roland JC-120.livewdf"
              "schematics/amps/EVH 5150 III 100S Stealth - Channel 3.livewdf"
              "schematics/pedals_fx/Boss MT-2 Metal Zone.livewdf"
              "schematics/pedals_fx/Boss DM-2 Analog Delay.livewdf"
            )
          fi
          for circuit in "${circuits[@]}"; do
            printf 'Auditing %s\n' "$circuit"
            stdbuf -oL build/plugin/LiveWDF_PluginBench_artefacts/Release/LiveWDF_PluginBench "$circuit" --audit
          done
