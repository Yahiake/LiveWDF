name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache xvfb libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev

      # ccache checks every hit against the compiler and preprocessed source, so an old cache only costs misses.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        id: build
        run: cmake --build build --parallel "$(nproc)"

      - uses: actions/cache/save@v6
        if: always() && steps.build.outcome != 'skipped'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xvfb-run -a "build/editor/LiveWDF_Editor_artefacts/Release/LiveWDF Editor" --selftest
          for circuit in schematics/*/*.livewdf; do
            printf 'Auditing %s\n' "$circuit"
            stdbuf -oL build/plugin/LiveWDF_PluginBench_artefacts/Release/LiveWDF_PluginBench "$circuit" --audit
          done
