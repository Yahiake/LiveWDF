<?xml version="1.0" encoding="UTF-8"?>
<!-- Current source: IEEE/IEC standard circle with directional current arrow.
     Pins: `pos` at grid (0,-2) = SVG (0,-20), `neg` at grid (0,2) = SVG (0,20).
     Convention: 10 SVG units = 1 grid square, (0,0) the centre. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <path d="M 0 -20 L 0 -12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 0 20 L 0 12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="12" fill="none" stroke="#000" stroke-width="1.2"/>
  <path d="M 0 7 L 0 -3" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 0 -8 L -4 -1 L 4 -1 Z" fill="#000" stroke="none"/>
</svg>
