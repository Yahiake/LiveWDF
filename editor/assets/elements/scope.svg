<?xml version="1.0" encoding="UTF-8"?>
<!-- Oscilloscope Probe. 120 x 120 frame; 10 SVG units = 1 grid square.
     Pins: probe (30,0) at grid (3,0), ref (0,40) at grid (0,4).
     Precision probe tip, contoured handle with grip rings, internal waveform,
     and downward ground lead with alligator clip. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="-60 -60 120 120" width="120" height="120"
     fill="none" stroke="#000" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-labelledby="title desc">
  <title id="title">Oscilloscope Probe</title>
  <desc id="desc">Precision oscilloscope probe with tip at right pin and ground clip at bottom pin.</desc>

  <g id="symbol">
    <!-- Probe tip needle to pin (30,0) -->
    <path d="M 30 0 H 16" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Contoured probe barrel -->
    <path d="M 16 -5 H -6 C -8 -5 -10 -3 -10 0 C -10 3 -8 5 -6 5 H 16 Z" fill="none" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Grip rings -->
    <path d="M 12 -5 V 5 M 8 -5 V 5" fill="none" stroke="#000" stroke-width="1.0" stroke-linecap="round"/>

    <!-- Internal waveform glyph -->
    <path d="M -5 0 Q -2.5 -4 0 0 T 5 0" fill="none" stroke="#000" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Ground reference lead down to alligator clip -->
    <path d="M 0 5 V 26" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Alligator clip body and jaws to ref pin (0,40) -->
    <path d="M -4 26 H 4 L 3 33 H -3 Z" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M -5 40 L 0 33 L 5 40 M -3 37 H 3" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
