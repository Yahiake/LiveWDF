<?xml version="1.0" encoding="UTF-8"?>
<!-- Resistor, IEC rectangle.

     **Copied from Céline** (`Celine/assets/icons/elements/resistor.svg`), because
     the shape *is* the port: Céline draws a resistor as the IEC rectangle, not the
     Cathodyne zigzag this file used to hold, and the two-pin parts are drawn
     **vertically** -- Céline's own default, with its example sheets rotated to
     lay them on their side. The pins in `PartLibrary` sit at grid (0,-2)/(0,2),
     which is SVG (0,-20)/(0,20), so this file's frame is the sheet's frame 1:1.

     The convention, which replacements must follow:
       * viewBox is -60 -60 120 120, and (0,0) is the part's CENTRE.
       * 10 SVG units = 1 grid square, so a pin at grid (0,-2) is at (0,-20).
       * stroke-width 1.2 is the schematic's normal line weight. Heavier lines
         are multiples of it (1.56 = 1.3x, 1.8 = 1.5x); the app re-strokes at
         that ratio so lines stay visible when zoomed out.
       * Colour is ignored - everything is recoloured by the app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <path d="M 0 -20 L 0 -12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 0 20 L 0 12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -7 -12 L 7 -12 L 7 12 L -7 12 Z" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
