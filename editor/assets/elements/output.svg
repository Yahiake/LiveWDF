<?xml version="1.0" encoding="UTF-8"?>
<!-- Output terminal. 120 x 120 frame; 10 SVG units = 1 grid square.
     Pin: sig (-20,0) at grid (-2,0).
     Clean proportional circular port with wire lead. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="-60 -60 120 120" width="120" height="120"
     fill="none" stroke="#000" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-labelledby="title desc">
  <title id="title">Output Terminal</title>
  <desc id="desc">Circular output port with wire lead to connection pin.</desc>

  <g id="symbol">
    <circle cx="12" cy="0" r="7" fill="none" stroke="#000" stroke-width="1.3"/>
    <path d="M 5 0 H -20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
