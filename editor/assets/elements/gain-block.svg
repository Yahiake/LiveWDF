<?xml version="1.0" encoding="UTF-8"?>
<!-- VCVS / gain block: a triangle, the amplifier convention.
     Pins at +/-3 grid squares means leads reach +/-30 SVG units.
     Convention: 10 SVG units = 1 grid square, (0,0) the centre. Colour ignored. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <path d="M -30 0 L -15 0" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 15 0 L 30 0" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -15 -18 L -15 18 L 15 0 Z" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M -5 -7 L 3 0 L -5 7" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
