<?xml version="1.0" encoding="UTF-8"?>
<!-- N-channel JFET. 120 x 120 frame; 10 SVG units = 1 grid square.
     Pins: G (-30,0), D (0,-30), S (0,30).

     DERIVED, not attested: nothing on the sheet is a National Semiconductor JFET -
     the sheet has no jfet group at all - so this file is that series' BJT drawing
     (`g23363`, held by `pnp-bjt.svg`) with the JFET's own difference applied. The
     BJT's base is a lead pressed straight onto the body; a junction's gate is an
     electrode, so here the middle contact becomes a PLATE, and the plate is drawn
     straight against the body stroke with no gap between them - they are a hairline
     apart, only so that two contacts still read as two strokes - that contact is
     what keeps this a junction and not a MOS, whose plate sits offset behind one.
     The solid arrowhead the family uses to mark its two polarities is kept, pointing
     AT the plate: away from it is the p-channel file.

     That sheet is MIT (© 2023 Sam Gallagher); this repo is AGPL-3.0, and MIT
     licenses are compatible with it. The proportions come from the sheet, rescaled
     into this frame: the body and plate are the same length, the legs bend onto the
     body at 0.4 of it out from the centre, and the arrowhead is as deep as its own
     base. The plate's length follows the body's, which is the junction's meaning:
     the electrode spans the whole contact.

     What differs from the sheet, and why: the series' BJT offsets its two legs
     across the body, while this frame's drain and source pins sit ON the part's
     centre line, so the legs run down that line and bend sideways; and the arrowhead
     is sized to the gate lead our frame has, which is shorter than the sheet's. The
     weights are the house's multiples rather than the sheet's, which draws every
     stroke at 6% of the body's length. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="-60 -60 120 120" width="120" height="120"
     fill="none" stroke="#000" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-labelledby="title desc">
  <title id="title">N-channel junction field-effect transistor</title>
  <desc id="desc">National Semiconductor style JFET: the drain and source legs bend onto one straight body stroke, a gate plate of the same length lies straight against it, and a solid arrowhead on the gate lead points at that plate.</desc>

  <g id="symbol">
    <!-- Gate lead, and the gate plate pressed straight against the body: contact, no gap -->
    <path d="M -30 0 H -12.7" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M -12.7 -11.2 V 11.2" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="butt"/>

    <!-- The body: the same length as the plate, one stroke both legs join -->
    <path d="M -10.5 -11.2 V 11.2" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="butt"/>

    <!-- Drain, from its pin at (0,-30): run down the centre line, then bend onto the body -->
    <path d="M 0 -30 V -9 H -10.5" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Source, from its pin at (0,30): the mirror leg -->
    <path d="M 0 30 V 9 H -10.5" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gate arrow, pointing at the plate: the series' N-channel mark -->
    <path d="M -12.7 0 L -22.5 -5 L -22.5 5 Z" fill="#000" stroke="none"/>
  </g>
</svg>
